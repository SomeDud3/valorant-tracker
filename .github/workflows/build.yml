name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ValTracker.apk
      - uses: actions/upload-artifact@v4
        with: { name: ValTracker, path: ValTracker.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "build-${{ github.run_number }}" ValTracker.apk --title "ValTracker build ${{ github.run_number }}" --notes "Automated build from ${{ github.sha }}" --latest
